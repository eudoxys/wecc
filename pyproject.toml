[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
# list every file pattern the package reads at run time
"wecc" = ["*.py"]

[tool.setuptools.dynamic]
dependencies = {file=["requirements.txt"]}

[project]
name = "wecc"
version = "0.0.0" # 0.0.0 = unreleased (hidden by `epm index`)
description = "WECC data in support of other Eudoxys packages"
authors = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
maintainers = [
    {name = "David P. Chassin <dchassin@eudoxys.com>"},
    ]
readme = "README.md"
requires-python = "== 3.12.*" # must match the CI python version
keywords = ["eudoxys","python"] # "eudoxys" marks an official Eudoxys release
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    ]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/eudoxys/wecc"
Documentation = "https://www.eudoxys.com/wecc"
Repository = "https://github.com/eudoxys/wecc.git"
Issues = "https://github.com/eudoxys/wecc/issues"

[project.scripts]
"wecc" = "wecc.cli:main" # omit if there is no CLI

[tool.pytest.ini_options]
testpaths = ["wecc/_test"]
markers = [
    "network: downloads external data (slow on an empty cache)",
    ]
